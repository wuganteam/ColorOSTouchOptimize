name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip (exclude dev files)
        run: |
          mkdir -p dist
          zip -r dist/ColorOSTouchOptimize-${{ github.ref_name }}.zip . \
            -x ".git/*" ".github/*" "update.json" "README.md" "CHANGELOG.md" "LICENSE" "*.zip" "dist/*"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ColorOSTouchOptimize-${{ github.ref_name }}.zip
          generate_release_notes: true
